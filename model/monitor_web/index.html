<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Spire 模型 Bootstrap 训练指标监测">
  <title>Spire · 训练监测</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">跳到训练指标</a>
<aside class="sidebar">
  <a class="brand" href="/"><img src="/favicon.svg" width="32" height="32" alt=""><span>SPIRE<span class="brand-sub">训练监测</span></span></a>
  <div class="kind-filters" role="group" aria-label="训练类型">
    <button type="button" class="kind-filter active" data-kind="all" aria-pressed="true"><span>全部训练</span><span id="count-all">0</span></button>
    <button type="button" class="kind-filter" data-kind="bootstrap" aria-pressed="false"><span><i class="kind-dot bootstrap"></i>Bootstrap</span><span id="count-bootstrap">0</span></button>
    <button type="button" class="kind-filter" data-kind="iterate" aria-pressed="false"><span><i class="kind-dot iterate"></i>迭代</span><span id="count-iterate">0</span></button>
  </div>
  <div class="sidebar-label">训练记录</div>
  <label class="search"><span class="sr-only">搜索训练目录</span><input id="search" type="search" placeholder="搜索训练目录…" autocomplete="off"></label>
  <nav id="run-list" class="run-list" aria-label="训练任务"><p class="sidebar-empty">正在读取训练目录…</p></nav>
  <div class="sidebar-bottom">只读 · 直接读取本地训练日志</div>
</aside>
<main id="main">
  <header class="topbar"><div id="connection" class="connection" role="status">连接中</div><div class="refresh-controls"><label class="auto-refresh"><input id="auto-refresh" type="checkbox" checked><span>自动刷新 · 5 秒</span></label><button id="refresh" class="button" type="button">刷新</button></div></header>
  <div class="workspace">
    <div id="error" class="notice error" role="alert" hidden></div>
    <div id="empty" class="empty-state" hidden><h1 id="empty-title">等待训练记录</h1><p id="empty-description"></p><code id="root-path"></code><p id="empty-hint">Bootstrap 每完成一次优化器更新，指标就会写入。</p></div>
    <div id="dashboard" hidden>
      <section class="run-heading" aria-label="当前训练任务"><div class="run-heading-main"><div class="run-title-line"><span id="run-kind" class="tag"></span><h1 id="run-name"></h1></div><p id="run-path" class="path"></p></div><button id="export" class="button" type="button">导出 CSV</button></section>
      <section class="status-strip" aria-label="训练状态"><div class="status-main"><span id="state" class="state-tag"></span><span id="status-detail"></span></div><div id="updated" class="status-time"></div></section>
      <div id="warnings" class="notices" aria-live="polite"></div>
      <div id="summary" class="summary-grid"></div>
      <div class="filters" role="group" aria-label="曲线显示设置">
        <label>显示范围<select id="range"><option value="0">全部更新</option><option value="100">最近 100 次更新</option><option value="1000">最近 1,000 次更新</option><option value="10000">最近 10,000 次更新</option><option value="50000">最近 50,000 次更新</option></select></label>
        <label>平滑<select id="smooth"><option value="auto">自动</option><option value="0">关闭</option><option value="10">10 点</option><option value="50">50 点</option><option value="200">200 点</option><option value="1000">1,000 点</option></select></label>
        <label>纵轴<select id="scale"><option value="focus">聚焦主体</option><option value="full">完整范围</option></select></label>
        <p id="curve-note" class="filters-note"></p>
      </div>
      <section aria-labelledby="trends-title">
        <div class="section-heading"><div><h2 id="trends-title">学习曲线</h2><p id="trends-note"></p></div></div>
        <div class="chart-grid"><article class="chart-card"><div class="chart-heading"><h3 id="primary-title"></h3><span id="primary-value" class="chart-value"></span></div><div id="chart-primary" class="chart"></div><div id="primary-legend" class="legend"></div></article><article class="chart-card"><div class="chart-heading"><h3 id="secondary-title"></h3><span id="secondary-value" class="chart-value"></span></div><div id="chart-secondary" class="chart"></div><div id="secondary-legend" class="legend"></div></article><article class="chart-card"><div class="chart-heading"><label for="metric-select">优化指标</label><select id="metric-select"></select></div><div id="chart-metric" class="chart"></div><div id="metric-legend" class="legend"></div></article><article class="chart-card"><div class="chart-heading"><h3 id="duration-title">单次更新耗时</h3><span id="duration-value" class="chart-value"></span></div><div id="chart-duration" class="chart"></div><div id="duration-legend" class="legend"></div></article></div>
      </section>
      <section class="details-panel" aria-label="训练详情"><div class="details-toolbar"><div class="tabs" role="tablist" aria-label="训练详情"><button id="tab-rounds" type="button" role="tab" aria-selected="true" aria-controls="panel-rounds" tabindex="0" data-tab="rounds">轮次汇总</button><button id="tab-groups" type="button" role="tab" aria-selected="false" aria-controls="panel-groups" tabindex="-1" data-tab="groups">角色表现</button><button id="tab-history" type="button" role="tab" aria-selected="false" aria-controls="panel-history" tabindex="-1" data-tab="history">更新记录</button><button id="tab-config" type="button" role="tab" aria-selected="false" aria-controls="panel-config" tabindex="-1" data-tab="config">训练配置</button></div><span id="record-count" class="muted"></span></div><div id="panel-rounds" class="tab-panel" role="tabpanel" aria-labelledby="tab-rounds"></div><div id="panel-groups" class="tab-panel" role="tabpanel" aria-labelledby="tab-groups" hidden></div><div id="panel-history" class="tab-panel" role="tabpanel" aria-labelledby="tab-history" hidden></div><div id="panel-config" class="tab-panel" role="tabpanel" aria-labelledby="tab-config" hidden></div></section>
    </div>
    <footer><span id="footer-note">状态以日志最后写入为准，不能证明进程存活 · 时间为浏览器本地时间</span></footer>
  </div>
</main>
<noscript>请启用 JavaScript 以读取训练指标。</noscript>
</body>
</html>
