<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spire · 训练监测</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#101519;color:#dfe8e7}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #2b363b;padding:22px 5%;display:flex;align-items:center;justify-content:space-between}header strong{font-size:21px;letter-spacing:.06em}.dim{color:#899c9e;font-size:13px}main{max-width:1400px;margin:auto;padding:30px 5%}h1{font-size:30px;margin:12px 0}select,button{background:#1c282d;color:#dfe8e7;border:1px solid #3b5157;border-radius:6px;padding:10px}#state{color:#91dcc6}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:24px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.plot,.table{background:#182126;border:1px solid #2b383e;border-radius:10px;padding:20px}.card b{display:block;font-size:27px;margin-top:12px;font-weight:500}.plots{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.plot h3{margin:0 0 14px;font-size:14px;font-weight:500;color:#a3b9bd}canvas{width:100%;height:220px}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left;white-space:nowrap}td,th{padding:13px 15px;border-bottom:1px solid #2b383e}th{color:#8fa4aa}details{margin-top:22px}pre{white-space:pre-wrap;font-size:12px;color:#abc0c4}.empty{padding:50px 0;color:#93abae}@media(max-width:750px){.cards,.plots{grid-template-columns:1fr 1fr}.plots .plot{grid-column:span 2}header{gap:16px}.card{padding:13px}}
</style>
<header><strong>SPIRE <span class="dim">/ TRAINING</span></strong><span id="connection" class="dim">正在连接</span></header>
<main><div class="dim">数据 → Bootstrap → PPO</div><h1>训练监测</h1><div class="toolbar"><select id="runs" aria-label="训练任务"></select><span id="state"></span><span class="dim" id="updated"></span></div>
<div id="empty" class="empty" hidden>还没有训练记录。启动 Bootstrap 或 PPO 后，此页面会自动显示进度。</div>
<section id="content"><div class="cards"><div class="card"><span class="dim">当前轮次</span><b id="round">—</b></div><div class="card"><span class="dim">Loss</span><b id="loss">—</b></div><div class="card"><span class="dim">策略版本</span><b id="version">—</b></div><div class="card"><span class="dim">最近一轮耗时</span><b id="duration">—</b></div></div>
<div class="plots"><div class="plot"><h3>Loss / epoch 或采样轮次</h3><canvas id="lossChart"></canvas></div><div class="plot"><h3>Entropy</h3><canvas id="entropyChart"></canvas></div><div class="plot"><h3>KL（PPO）</h3><canvas id="klChart"></canvas></div><div class="plot"><h3>五角色平均胜率（PPO）</h3><canvas id="winChart"></canvas></div></div>
<div class="table"><table><thead><tr><th>轮次</th><th>阶段</th><th>Loss</th><th>Entropy</th><th>KL</th><th>Value MSE</th><th>Clip fraction</th><th>梯度范数</th><th>更新次数</th><th>时间</th></tr></thead><tbody id="rows"></tbody></table></div><details><summary>本轮完整训练信息</summary><pre id="detail"></pre></details></section></main>
<script>
let data=[],selected='';const $=id=>document.getElementById(id),fmt=x=>typeof x==='number'?Number(x.toPrecision(5)).toString():'—';
const metrics=r=>Array.isArray(r.metrics)?r.metrics.at(-1)||{}:r.metrics||{};
function plot(id,rows,get){const c=$(id),box=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=box.width*dpr;c.height=220*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);const w=box.width,h=220,p=40,points=rows.map((r,i)=>[i,get(r)]).filter(x=>Number.isFinite(x[1]));g.font='11px system-ui';g.fillStyle='#7f979e';if(!points.length){g.fillText('等待数据',p,h/2);return}let lo=Math.min(...points.map(x=>x[1])),hi=Math.max(...points.map(x=>x[1]));if(lo===hi){lo-=.1;hi+=.1}for(let i=0;i<4;i++){let y=15+i*(h-45)/3;g.strokeStyle='#29373d';g.beginPath();g.moveTo(p,y);g.lineTo(w-12,y);g.stroke();g.fillText(fmt(hi-i*(hi-lo)/3),0,y+4)}g.strokeStyle='#81d8ba';g.lineWidth=2;g.beginPath();points.forEach(([i,v],j)=>{let x=p+i*(w-p-12)/Math.max(rows.length-1,1),y=15+(hi-v)/(hi-lo)*(h-45);j?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();for(const [i,v] of points){g.beginPath();g.arc(p+i*(w-p-12)/Math.max(rows.length-1,1),15+(hi-v)/(hi-lo)*(h-45),2.5,0,Math.PI*2);g.fillStyle='#81d8ba';g.fill()}g.fillStyle='#7f979e';g.fillText('轮次 '+rows[0].round,p,h-4);g.fillText(rows.at(-1).round,w-35,h-4)}
function render(){const run=data.find(x=>x.name===selected);$('empty').hidden=!!run;$('content').hidden=!run;if(!run)return;const rows=run.history,last=rows.at(-1)||{},m=metrics(last),states={starting:'准备中',running:'训练中',collecting:'正在采样',updating:'正在更新权重',completed:'已完成',failed:'失败',interrupted:'已中断'};$('state').textContent=(states[run.status.state]||run.status.state)+(run.status.games_total?' · '+run.status.games_completed+'/'+run.status.games_total+' 局':'');$('updated').textContent=run.status.error||'最近更新 '+new Date(run.status.time).toLocaleString();$('round').textContent=run.status.round??last.round??'—';$('loss').textContent=fmt(m.loss);$('version').textContent=last.policy_version??'—';$('duration').textContent=last.duration_seconds?Math.round(last.duration_seconds)+' s':'—';$('detail').textContent=JSON.stringify(last,null,2);$('rows').replaceChildren();for(const r of rows.slice(-100).reverse()){const m=metrics(r),tr=document.createElement('tr');for(const value of [r.round,r.stage||r.kind,fmt(m.loss),fmt(m.entropy),fmt(m.kl),fmt(m.value_mse),fmt(m.clip_fraction),fmt(m.last_grad_norm),m.updates,r.time?new Date(r.time).toLocaleString():'原日志未记录']){let td=document.createElement('td');td.textContent=value??'—';tr.append(td)}$('rows').append(tr)}plot('lossChart',rows,r=>metrics(r).loss);plot('entropyChart',rows,r=>metrics(r).entropy);plot('klChart',rows,r=>r.kind==='ppo'?metrics(r).kl:null);plot('winChart',rows,r=>r.evaluation?.equal_character_win_rate)}
async function refresh(){try{const response=await fetch('/api/runs');if(!response.ok)throw Error(response.status);data=await response.json();if(!data.some(r=>r.name===selected))selected=data[0]?.name||'';$('runs').replaceChildren(...data.map(r=>{const o=document.createElement('option');o.value=r.name;o.textContent=r.name+' · '+r.status.kind.toUpperCase();o.selected=r.name===selected;return o}));$('connection').textContent='● 已连接 · 每 3 秒更新';render()}catch(e){$('connection').textContent='连接中断，正在重试'}finally{setTimeout(refresh,3000)}}$('runs').onchange=()=>{selected=$('runs').value;render()};window.onresize=render;refresh();
</script></html>
